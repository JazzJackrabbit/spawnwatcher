name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # App config lives on the Dokku host (`dokku config:set`); the deploy
      # only ships code.
      - name: Push to Dokku
        uses: dokku/github-action@v1.7.0
        with:
          git_remote_url: ssh://dokku@${{ secrets.DOKKU_HOST }}:${{ secrets.DOKKU_SSH_PORT }}/spawnwatcher
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          # The Dokku app deploys from main; the action pushes to master by
          # default, which Dokku silently accepts without deploying.
          branch: main
